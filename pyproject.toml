# ─────────────────────────────────────────────────────────────────────────────
# ROOT pyproject.toml  —  the workspace root.
#
# Each course project lives in its own NN_name/ folder with its own small
# pyproject.toml. They all share ONE .venv, ONE uv.lock and ONE .env (this file
# is what ties them together).
#
#   uv run --package hello-world 01_hello_world/main.py   <- run a project
#   uv add --package hello-world tavily-python            <- dep for ONE project
#   uv add langchain-community                            <- dep for ALL projects
#   uv sync --all-packages                                <- install everything
# ─────────────────────────────────────────────────────────────────────────────

[project]
name = "langchain-course"
version = "0.1.0"
description = "Working through the LangChain & LangGraph course, one folder per project."
readme = "README.md"
requires-python = ">=3.14"

# Shared by every project, so they live here rather than being repeated.
dependencies = [
    "langchain>=1.4.1",
    "langchain-anthropic>=1.7.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.2",
    "python-dotenv>=1.2.3",
]

# Any folder named like 01_foo / 02_bar that contains a pyproject.toml is
# automatically part of the workspace. Create the next one and it just joins.
[tool.uv.workspace]
members = [
    "[0-9][0-9]_*",
    "React_tool_calling",
]

# This repo is a collection of scripts, not an installable library, so there is
# no [build-system] and uv never tries to build/install it. Same for each member.
[tool.uv]
package = false

# Formatting tools. Not needed to run the projects, so they sit in a dev group
# (installed by `uv sync`, excluded from `uv sync --no-dev`).
[dependency-groups]
dev = [
    "black>=26.5.1",
    "isort>=9.0.1",
]
