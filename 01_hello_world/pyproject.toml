# Project 1 — Hello World. Run with:  uv run --package hello-world 01_hello_world/main.py
[project]
name = "hello-world"
version = "0.1.0"
description = "First LangChain agent: prompt template + local Ollama model."
requires-python = ">=3.14"

# Only what this project imports. Shared libs are in the root pyproject.toml.
dependencies = [
    "langchain>=1.4.1",
    "langchain-ollama>=1.1.0",
    "python-dotenv>=1.2.3",
]

[tool.uv]
package = false
